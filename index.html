<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição - GP de Kart Siqueira Campos 2026</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <div class="event-sidebar sidebar-custom-bg">
            <img src="/banner" alt="Banner" style="width:100%; height:100%; object-fit:contain;">
        </div>

        <div class="form-section">

            <div class="form-step active" id="step-1">
                <form id="registration-form">

                    <h2 class="form-title">Dados Pessoais</h2>

                    <div class="form-group">
                        <label for="name_do_piloto">Nome do Piloto</label>
                        <input type="text" id="name_do_piloto" required placeholder="Digite seu nome do Piloto">
                    </div>

                    <div class="form-group">
                        <label for="cpf_do_piloto">CPF do Piloto</label>
                        <input type="text" id="cpf_do_piloto" required placeholder="000.000.000-00" maxlength="14"
                            pattern="\d{3}\.\d{3}\.\d{3}\-\d{2}" title="Digite um CPF válido no formato 000.000.000-00">
                    </div>

                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" required placeholder="Digite seu email">
                    </div>

                    <div class="form-group">
                        <label for="telefone">Telefone</label>
                        <input type="text" id="telefone" required placeholder="(00) 00000-0000" maxlength="11">
                    </div>

                    <div class="form-group">
                        <label for="numero_da_cba">Numero de cedula CBA</label>
                        <input type="text" id="numero_da_cba" required placeholder="Digite seu numero da cedula CBA">
                    </div>

                    <div class="form-group">
                        <label for="idade">Idade</label>
                        <input type="number" id="idade" required placeholder="Digite sua idade" min="1" max="110">
                    </div>

                    <div id="container-responsavel" style="display: none;">

                        <div class="form-group">
                            <label for="nome_do_responsavel">Nome do Responsável</label>
                            <input type="text" id="nome_do_responsavel" placeholder="Digite o nome do responsável">
                        </div>

                        <div class="form-group">
                            <label for="cpf_do_responsavel">CPF do Responsável</label>
                            <input type="text" id="cpf_do_responsavel" placeholder="000.000.000-00" maxlength="14"
                                pattern="\d{3}\.\d{3}\.\d{3}\-\d{2}"
                                title="Digite um CPF válido no formato 000.000.000-00">
                        </div>
                    </div>

                    <div class="form-group-row">
                        <div class="form-group">
                            <label for="numero_do_piloto">Numero do piloto</label>
                            <input type="number" id="numero_do_piloto" required placeholder="000">
                        </div>
                        <div class="form-group">
                            <label for="categoria">Categoria</label>
                            <select id="categoria" required>
                                <option value="" disabled selected>Selecione</option>
                                <option value="Mirim">Mirim</option>
                                <option value="Cadete">Cadete</option>
                                <option value="F4J">F4 Junior</option>
                                <option value="F4N">F4 Novatos</option>
                                <option value="F4G">F4 Graduados</option>
                                <option value="F4S">F4 Sênior</option>
                                <option value="F4SS">F4 Super Sênior</option>
                                <option value="F4GSS">F4 Grand Super Sênior</option>
                                <option value="F4EX">F4 Expert (60+)</option>
                                <option value="Junior">Junior 2T</option>
                                <option value="Graduados">Graduados 2T</option>
                                <option value="Senior">Sênior 2T</option>

                            </select>
                        </div>
                        <div class="form-group">
                            <label for="tamanho_Camisa">Kit Prova - Camiseta</label>
                            <select id="tamanho_Camisa" required>
                                <option value="" disabled selected>Selecione o Tamanho</option>
                                <option value="8anos">8 anos</option>
                                <option value="10anos">10 anos</option>
                                <option value="P">P</option>
                                <option value="M">M</option>
                                <option value="G">G</option>
                                <option value="GG">GG</option>

                            </select>
                        </div>
                    </div>

                    <div class="regulation-box">
                        <div class="regulation-download">
                            <span>📄 Antes de prosseguir, leia o regulamento:</span>
                            <a href="/regulamento" download>
                                Baixar regulamento
                            </a>
                        </div>
                    </div>
                    <hr style="border: 0; border-top: 1px solid #E5E7EB; margin: 30px 0;">
                    <h2 class="form-title">Pagamento</h2>
                    <div class="payment-methods"
                        style="display: flex; justify-content: center; align-items: center; margin-bottom: 20px;">
                        <div class="payment-opt selected" id="opt-pix" style="text-align: center; cursor: default;">
                            <svg style="width: 24px; height: 24px; display: block; margin: 0 auto 5px auto;"
                                viewBox="0 0 24 24" fill="currentColor">
                                <path
                                    d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H7c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.04-.42 1.99-1.07 2.75z" />
                            </svg>
                            Pix (QR Code)
                        </div>
                    </div>

                    <div class="payment-details-box">
                        <div class="pix-container" id="pix-details" style="display: block;">
                            <p style="font-size: 0.9rem; margin-bottom: 15px;">O QR Code e a chave Pix copia e cola
                                serão exibidos aqui após clicar em Gerar Pix.</p>
                            <div class="pix-qr" id="pix-qr-area">
                                <div id="pix-loading" style="display:none; color: #4B5563; font-weight: bold;">Gerando
                                    seu Pix..</div>
                                <img id="pix-qr-image" src=""
                                    style="width: 220px; height: 220px; display:none; margin: 0 auto 15px auto;"
                                    alt="QR Code PIX" />
                            </div>
                            <div class="pix-code" id="pix-copia-cola"
                                style="display:none; word-break: break-all; background: #F3F4F6; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 0.85rem; margin-bottom: 15px;">
                            </div>
                            <button type="button" class="btn-copy" id="btn-copy-pix"
                                style="display:none; padding: 8px 16px; cursor: pointer;">Copiar Código
                                Pix</button>
                        </div>
                    </div>

                    <div class="btn-container" style="margin-top: 20px; text-align: center;">
                        <button type="submit" class="btn btn-primary" id="btn-submit-payment">Gerar Pix</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
